[package]
name = "poisoned-bridge"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "poisoned-bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["ws"] }
btleplug = "0.11.8"
futures-util = "0.3.31"
poison-builder = { path = "../builder" }
getrandom = "0.3.3"
keyring = "3.6.3"
prost = "=0.14.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5.4.5"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
