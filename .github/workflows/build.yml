name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify pinned toolchain
        run: |
          ./fbt -h >/dev/null
          python3 tools/verify_toolchain.py
      - name: Build firmware, updater, and resources
        run: ./fbt firmware_all updater_all resources
      - name: Verify independent reproducible builds
        run: python3 tools/check_reproducible_build.py
