name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify pinned toolchain
        run: |
          ./fbt -h >/dev/null
          python3 tools/verify_toolchain.py
      - name: Run source, Python, and image linters
        run: ./fbt lint_all
