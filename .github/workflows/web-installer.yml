name: Web installer

on:
  push:
    paths:
      - ".github/workflows/web-installer.yml"
      - "dashboard/src/generated/**"
      - "schemas/poison/release-manifest.schema.json"
      - "schemas/poison/web-installer-feed.schema.json"
      - "tools/release/build_web_installer_feed.py"
      - "tools/release/tests/test_build_web_installer_feed.py"
      - "web-installer/**"
  pull_request:
    paths:
      - ".github/workflows/web-installer.yml"
      - "dashboard/src/generated/**"
      - "schemas/poison/release-manifest.schema.json"
      - "schemas/poison/web-installer-feed.schema.json"
      - "tools/release/build_web_installer_feed.py"
      - "tools/release/tests/test_build_web_installer_feed.py"
      - "web-installer/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-installer-${{ github.event_name == 'release' && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked installer dependencies
        run: pnpm install --dir web-installer --frozen-lockfile
      - name: Verify Python runner
        run: uv --version
      - name: Verify browser installer
        run: pnpm --dir web-installer verify
      - name: Verify signed-feed builder
        run: uv run --no-project --python 3.11 python -m unittest tools.release.tests.test_build_web_installer_feed

  build-pages:
    if: github.event_name == 'release' && github.event.action == 'published' && vars.POISON_RELEASE_DISTRIBUTION_APPROVED == 'true'
    needs: verify
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    env:
      POISON_RELEASE_TAG: ${{ github.event.release.tag_name }}
      POISON_RELEASE_KEY_ID: ${{ vars.POISON_RELEASE_KEY_ID }}
      POISON_RELEASE_PUBLIC_KEY_PEM: ${{ vars.POISON_RELEASE_PUBLIC_KEY_PEM }}
      VITE_POISON_RELEASE_KEYS: ${{ vars.POISON_RELEASE_KEYS_JSON }}
      VITE_POISON_RELEASE_FEED_URL: ./releases.json
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install locked installer dependencies
        run: pnpm install --dir web-installer --frozen-lockfile
      - name: Verify Python runner
        run: uv --version
      - name: Download signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p installer-release/dist/f7-C
          gh release download "$POISON_RELEASE_TAG" --pattern release.json --output installer-release/release.json
          gh release download "$POISON_RELEASE_TAG" --pattern flipper-z-f7-update-poisonedos.tgz --output installer-release/dist/f7-C/flipper-z-f7-update-poisonedos.tgz
      - name: Validate the commissioned browser trust key
        run: |
          uv run --no-project --python 3.11 python -c 'import json, os, pathlib, sys; key_id=os.environ.get("POISON_RELEASE_KEY_ID", ""); pem=os.environ.get("POISON_RELEASE_PUBLIC_KEY_PEM", ""); keys=json.loads(os.environ.get("VITE_POISON_RELEASE_KEYS", "null")); sys.exit("release key variables are missing or inconsistent") if not key_id or not pem or keys != {key_id: pem} else pathlib.Path("installer-release/release-public.pem").write_text(pem, encoding="utf-8")'
      - name: Bind the release tag to the signed manifest version
        run: |
          uv run --no-project --python 3.11 python -c 'import json, os, pathlib, sys; manifest=json.loads(pathlib.Path("installer-release/release.json").read_text(encoding="utf-8")); version=manifest.get("version"); tag=os.environ.get("POISON_RELEASE_TAG", ""); sys.exit("release tag does not match the signed manifest version") if not isinstance(version, str) or tag not in (version, f"v{version}") else None'
      - name: Build verified release feed
        run: |
          uv run --no-project --python 3.11 python tools/release/build_web_installer_feed.py \
            --root installer-release \
            --output installer-release/releases.json \
            --public-key "$POISON_RELEASE_KEY_ID=installer-release/release-public.pem" \
            --release installer-release/release.json installer-release/dist/f7-C/flipper-z-f7-update-poisonedos.tgz "releases/$POISON_RELEASE_TAG/flipper-z-f7-update-poisonedos.tgz"
      - name: Build static installer
        run: pnpm --dir web-installer build
      - name: Stage immutable release package
        run: |
          mkdir -p "web-installer/dist/releases/$POISON_RELEASE_TAG"
          cp installer-release/releases.json web-installer/dist/releases.json
          cp installer-release/dist/f7-C/flipper-z-f7-update-poisonedos.tgz "web-installer/dist/releases/$POISON_RELEASE_TAG/flipper-z-f7-update-poisonedos.tgz"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web-installer/dist

  deploy-pages:
    if: github.event_name == 'release' && github.event.action == 'published' && vars.POISON_RELEASE_DISTRIBUTION_APPROVED == 'true'
    needs: build-pages
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified installer to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
