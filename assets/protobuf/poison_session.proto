syntax = "proto3";

package PB_Poison;

message PairingHello {
    uint32 protocol_version = 1;
    bytes client_ephemeral_public_key = 2;
    string client_name = 3;
    uint32 requested_role = 4;
    uint32 requested_capabilities = 5;
    bytes client_nonce = 6;
    bytes client_identity_public_key = 7;
}

message PairingChallenge {
    uint32 protocol_version = 1;
    bytes device_ephemeral_public_key = 2;
    bytes device_nonce = 3;
    string confirmation_code = 4;
    bytes transcript_digest = 5;
    uint64 expires_at_ms = 6;
    fixed64 session_id = 7;
    bool identity_trusted = 8;
}

message PairingConfirm {
    bytes transcript_digest = 1;
    string confirmation_code = 2;
    bool physical_confirmation = 3;
    bytes client_identity_signature = 4;
}

message SessionEnvelope {
    uint32 protocol_version = 1;
    fixed64 session_id = 2;
    fixed64 sequence = 3;
    fixed64 acknowledgement = 4;
    string channel = 5;
    bytes payload = 6;
    bytes authentication_tag = 7;
}

message ChannelOpen {
    string channel = 1;
    uint32 initial_credits = 2;
    uint64 resume_sequence = 3;
}

message ChannelOpened {
    string channel = 1;
    uint32 granted_credits = 2;
    uint64 next_sequence = 3;
}

message CreditUpdate {
    string channel = 1;
    uint32 credits = 2;
}

message CancelRequest {
    uint64 command_id = 1;
    string reason = 2;
}

message Cancelled {
    uint64 command_id = 1;
    bool accepted = 2;
}

message ResumeRequest {
    fixed64 session_id = 1;
    bytes resume_token = 2;
    uint64 last_received_sequence = 3;
}

message ResumeResponse {
    bool accepted = 1;
    bytes resume_token = 2;
    uint64 next_sequence = 3;
    string error = 4;
}
