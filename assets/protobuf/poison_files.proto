syntax = "proto3";

package PB_Poison;

message LogicalPath {
    string path = 1;
}

message FileStat {
    string path = 1;
    uint64 size = 2;
    uint64 modified_at_ms = 3;
    bool directory = 4;
    string sha256 = 5;
}

message FileListRequest {
    string path = 1;
    string cursor = 2;
    uint32 page_size = 3;
}

message FileListResponse {
    repeated FileStat entries = 1;
    string next_cursor = 2;
}

message FileTransferBegin {
    string operation_id = 1;
    string path = 2;
    uint64 size = 3;
    string sha256 = 4;
}

message FileTransferChunk {
    string operation_id = 1;
    uint64 offset = 2;
    bytes data = 3;
    string sha256 = 4;
}

message FileTransferComplete {
    string operation_id = 1;
    string sha256 = 2;
    uint64 size = 3;
}

message FileConflict {
    string path = 1;
    string existing_sha256 = 2;
    string incoming_sha256 = 3;
}
