syntax = "proto3";

package PB_Poison;

message EvidenceLabel {
    string key = 1;
    string value = 2;
}

message EvidenceRecord {
    string evidence_id = 1;
    string case_id = 2;
    string source_app_id = 3;
    uint64 captured_at_unix_ms = 4;
    string device_id = 5;
    string firmware_version = 6;
    string content_sha256 = 7;
    uint64 content_length = 8;
    string media_type = 9;
    repeated EvidenceLabel labels = 10;
    string previous_audit_sha256 = 11;
    string audit_sha256 = 12;
    string operator_id = 13;
    string tool_id = 14;
    string tool_version = 15;
    bytes canonical_parameters = 16;
    string source_path = 17;
}

message Case {
    string case_id = 1;
    string name = 2;
    string purpose = 3;
    string owner_id = 4;
    uint64 created_at_ms = 5;
    string retention_policy = 6;
}

message ToolRun {
    string run_id = 1;
    string case_id = 2;
    string tool_id = 3;
    string tool_version = 4;
    uint64 started_at_ms = 5;
    uint64 finished_at_ms = 6;
    string state = 7;
}

message Annotation {
    string annotation_id = 1;
    string evidence_id = 2;
    string author_id = 3;
    uint64 created_at_ms = 4;
    string text = 5;
    repeated string tags = 6;
}

message ExportManifest {
    string export_id = 1;
    string schema = 2;
    repeated string evidence_ids = 3;
    string manifest_sha256 = 4;
    string signature = 5;
    uint32 batch_index = 6;
    bool finalize = 7;
    uint32 accepted_evidence_ids = 8;
}
